# Tests and builds the Windows app on every push and pull request. On main, a new "## Version:" in Brag/Brag.toc
# (one without a v<version> tag) is released: the addon zip (Brag/ at the top: the folder name must match Brag.toc)
# goes to CurseForge if configured, and both the zip and the Windows app (BragSetup.exe, built by
# windows/build.ps1) go to a GitHub release tagged v<version>.
# All or nothing: a failed test or Windows build releases nothing. Everything that can fail is done before the
# CurseForge upload, with the GitHub release staged as a draft; it's published (which creates the tag) right
# after the upload. A failure before the upload leaves no tag, so the next push (or Run workflow) just retries.
# The one step after the upload is publishing the draft, retried a few times; if even that fails, the job says
# to publish the draft by hand instead of rerunning, which would upload the same version to CurseForge again.
# CurseForge setup: repository secret CF_API_TOKEN (https://legacy.curseforge.com/account/api-tokens)
#                   repository variable CF_PROJECT_ID (numeric, from "About Project" on the CurseForge page)
name: Test and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # rerun a failed upload by hand

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow lupa
      - run: python test_watch.py && python test_addon.py # test_addon runs Brag.lua in Lua 5.1 with a mock WoW API
        working-directory: companion

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r windows/requirements.txt
      - run: python test_desktop.py
        working-directory: companion
      - name: Install Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: ./windows/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: BragSetup
          path: dist/BragSetup.exe
          if-no-files-found: error

  release:
    needs: [test, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + GitHub release
    env:
      GH_TOKEN: ${{ github.token }} # for gh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for the changelog

      - name: Check for a new version
        id: version
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: |
          version=$(sed -n 's/^## Version: *//p' Brag/Brag.toc | tr -d '\r[:space:]')
          [ -n "$version" ] || { echo "::error::No '## Version:' in Brag/Brag.toc"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; bump '## Version:' in Brag/Brag.toc to publish."
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_PROJECT_ID" ]; then
            echo "curseforge=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Releasing v$version on GitHub only: set the CF_API_TOKEN secret and CF_PROJECT_ID variable to also upload to CurseForge."
          fi

      - name: Package
        if: steps.version.outputs.version
        run: |
          version=${{ steps.version.outputs.version }}
          zip -r "Brag-$version.zip" Brag -x '*.DS_Store'
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          git log --no-merges --format='- %s' ${prev:+$prev..}HEAD > changelog.md
          cat changelog.md

      - uses: actions/download-artifact@v8
        if: steps.version.outputs.version
        with:
          name: BragSetup

      - name: Prepare the CurseForge upload
        if: steps.version.outputs.curseforge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # "## Interface: 16001" -> CurseForge game version "1.60.1" -> its numeric id
          curl -sSf -H "X-Api-Token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/versions > versions.json
          python3 - <<'EOF'
          import json, os, re, sys
          toc = open("Brag/Brag.toc", encoding="utf-8").read()
          interfaces = re.search(r"^## Interface: *(.+)$", toc, re.M).group(1).replace(" ", "").split(",")
          names = [f"{int(i) // 10000}.{int(i) // 100 % 100}.{int(i) % 100}" for i in interfaces]
          versions = json.load(open("versions.json"))
          ids = [v["id"] for v in versions if v["name"] in names]
          if len(ids) < len(names):
              close = sorted({v["name"] for v in versions if v["name"].startswith(tuple(n.rsplit(".", 1)[0] for n in names))})
              sys.exit(f"::error::CurseForge has no game version {names}. Close matches: {close}")
          json.dump({
              "changelog": open("changelog.md", encoding="utf-8").read() or "- Update",
              "changelogType": "markdown",
              "displayName": f"Brag {os.environ['VERSION']}",
              "gameVersions": ids,
              "releaseType": "release",
          }, open("metadata.json", "w"))
          print(f"Game versions {names} -> ids {ids}")
          EOF

      - name: Stage the GitHub release as a draft
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # A draft has no tag yet. A draft left by an earlier failed run is replaced.
        # BragSetup.exe keeps its name, so https://github.com/<repo>/releases/latest/download/BragSetup.exe always works.
        run: |
          if [ "$(gh release view "v$VERSION" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "v$VERSION" --yes
          fi
          gh release create "v$VERSION" "Brag-$VERSION.zip" BragSetup.exe --draft \
            --target "$GITHUB_SHA" --title "Brag $VERSION" --notes-file changelog.md

      - name: Upload to CurseForge
        if: steps.version.outputs.curseforge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -sS --fail-with-body -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=<metadata.json" \
            -F "file=@Brag-$VERSION.zip" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file"

      - name: Publish the GitHub release (creates the tag)
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in 1 2 3; do
            gh release edit "v$VERSION" --draft=false && exit 0
            sleep 10
          done
          echo "::error::v$VERSION is on CurseForge, but its GitHub release is still a draft. Publish the draft by hand (Releases, Edit, Publish release); don't rerun this workflow, or CurseForge gets v$VERSION twice."
          exit 1
